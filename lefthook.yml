# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
pre-commit:
  jobs:
    - run: bun run fix
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - run: bun run knip
    - run: bun run test
    - name: build-and-typecheck
      group:
        piped: true
        jobs:
          - run: bun run build -- --ui=stream --output-logs=errors-only
          - run: bun run typecheck -- --ui=stream --output-logs=errors-only
