# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Deploy E2E

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: alchemy-e2e
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Load deployment credentials
        id: onepassword
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://uhub4xx3iwwsaxj3robdosm2hu/jzwlhhnq7fhnsoazz2esnl4xt4/CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN: op://uhub4xx3iwwsaxj3robdosm2hu/jzwlhhnq7fhnsoazz2esnl4xt4/CLOUDFLARE_API_TOKEN

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check out trusted deployment config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install trusted deployment dependencies
        run: bun install --frozen-lockfile

      - name: Download the exact successful CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-e2e
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare isolated Worker entrypoint
        env:
          ALCHEMY_E2E_ARTIFACT: ${{ runner.temp }}/alchemy-e2e
        run: bun run scripts/prepare-e2e-worker.ts

      - name: Deploy isolated E2E Worker
        env:
          ALCHEMY_E2E_ARTIFACT: ${{ runner.temp }}/alchemy-e2e
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.onepassword.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.onepassword.outputs.CLOUDFLARE_API_TOKEN }}
        run: bunx --no-install alchemy deploy --config alchemy-e2e.run.ts --stage e2e --yes
