name: Verify migrated credentials
on:
  pull_request:
    paths:
      - '.env.schema'
      - 'apps/website/.env.schema'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/credentials-check.yml'
permissions: {}
jobs:
  credentials:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/CLOUDFLARE_API_TOKEN
          CONTACT_RECIPIENT: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/CONTACT_RECIPIENT
          LASTFM_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/LASTFM_API_KEY
          LASTFM_USERNAME: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/LASTFM_USERNAME
          MDFROMX_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/MDFROMX_API_KEY
          RESEND_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/RESEND_API_KEY
          RESEND_FROM: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/RESEND_FROM
          WORKER_GITHUB_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/jtvbfpfahaphyhmbl4eqplrcym/add more/WORKER_GITHUB_TOKEN
          GH_APP_ID: op://i56qshgciuy4cdg4pjrilaeriy/42szi44u2t6lu4d5jnr3a2hbae/ID
          GH_APP_PRIVATE_KEY: op://i56qshgciuy4cdg4pjrilaeriy/42szi44u2t6lu4d5jnr3a2hbae/github-app.pem
