name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      publish_release:
        description: Retry staging the current package.json version
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Version packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The GitHub API path creates GPG-signed, Verified commits.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run changeset version && bun install --lockfile-only
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          push-with-git-cli: false

  publish:
    name: Stage npm package
    needs: version
    if: |
      always() && (
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main'
        ) ||
        (
          needs.version.result == 'success' &&
          needs.version.outputs.has_changesets == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_release == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # npm stage requires CLI >= 11.15.0. Do not configure registry-url:
      # setup-node would write a token-based .npmrc and interfere with OIDC.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Stage package on npm
        id: publish
        working-directory: packages/mynameistito
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          package_spec="$package_name@$package_version"

          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Staging $package_spec for npm approval"
          unset NODE_AUTH_TOKEN
          npm stage publish . --access public --provenance
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.publish.outputs.published == 'true' || steps.publish.outputs.staged == 'true'
        working-directory: packages/mynameistito
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          tag="$package_name@$package_version"

          PACKAGE_VERSION="$package_version" node --input-type=module <<'EOF' > release-notes.md
          const fs = await import("node:fs/promises");
          const changelog = await fs.readFile("CHANGELOG.md", "utf-8");
          const heading = `## ${process.env.PACKAGE_VERSION}`;
          const start = changelog.indexOf(heading);
          const bodyStart = start === -1 ? -1 : changelog.indexOf("\n", start) + 1;
          const nextHeading = bodyStart === -1 ? -1 : changelog.indexOf("\n## ", bodyStart);
          const notes = bodyStart === -1
            ? `Release ${process.env.PACKAGE_VERSION}`
            : changelog.slice(bodyStart, nextHeading === -1 ? undefined : nextHeading).trim();

          console.log(notes);
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest
