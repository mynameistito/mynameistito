name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Retry staging and publishing the current package version
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release packages
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@11.15.0

      - name: Verify npm staged publishing support
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major = 0, minor = 0, patch = 0] = version.split(".").map(Number);
          const supported = major > 11 || (major === 11 && (minor > 15 || (minor === 15 && patch >= 0)));

          if (!supported) {
            throw new Error(`npm ${version} does not support staged publishing. Use npm >= 11.15.0.`);
          }
          EOF

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: |
          bun run typecheck
          bun run check
          bun run build
          bun run test

      - name: Stage package on npm
        run: bun run release:stage

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the command chain in package.json; the action passes this input through @actions/exec.
          version-script: bun run changeset-version
          publish-script: bun run release:tag
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          push-with-git-cli: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
